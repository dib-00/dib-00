# Draws the contribution snake shown in the README and publishes it to the "output" branch.
name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#16a34a&color_dots=#ebedf0,#bbf7d0,#4ade80,#16a34a,#14532d
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#4ade80&color_dots=#0b1f17,#14532d,#166534,#22c55e,#4ade80

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
