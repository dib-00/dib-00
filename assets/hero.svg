<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320" role="img" aria-label="Dibyendu Mondal, AI and Automation Engineer, Kolkata. Circuit, model, product.">
  <title>Dibyendu Mondal · AI &amp; Automation Engineer · Circuit → Model → Product</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040705"/>
      <stop offset="0.6" stop-color="#07120c"/>
      <stop offset="1" stop-color="#0c2419"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a1e"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#4ade80" opacity="0.10"/>
    </pattern>
    <clipPath id="card"><rect x="1" y="1" width="838" height="318" rx="18"/></clipPath>
  </defs>
  <style>
    .traces path { fill: none; stroke: #1f6b45; stroke-width: 1.4; }
    .pulse { fill: none; stroke: #4ade80; stroke-width: 2.2; stroke-linecap: round;
              stroke-dasharray: 14 400; stroke-dashoffset: 414; animation: run 3s linear infinite; }
    .rot { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 15px; fill: #b6f7d0; opacity: 0;
            animation: rot 12.8s ease-in-out infinite; }
    .core { animation: core 2.4s ease-in-out infinite; }
    .blink { animation: blink 1.6s ease-in-out infinite; }
    @keyframes run { to { stroke-dashoffset: 0; } }
    @keyframes rot { 0% { opacity: 0; transform: translateY(8px); } 3.0% { opacity: 1; transform: none; }
                      21.2% { opacity: 1; transform: none; } 25.0%, 100% { opacity: 0; transform: translateY(-8px); } }
    @keyframes core { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .core, .blink { animation: none; }
      .rot { animation: none; } .rot:first-of-type { opacity: 1; }
    }
  </style>

