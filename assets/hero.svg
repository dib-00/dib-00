  <text x="46" y="140" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-0.5" fill="#f0fdf4">Dibyendu</text>
  <text x="46" y="200" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-0.5" fill="url(#name)">Mondal</text>
