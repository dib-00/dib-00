    <path class="pulse" style="animation-delay:1.85s" d="M722.0 170 H750.0 V188 H820"/>
    <path class="pulse" style="animation-delay:2.22s" d="M630.0 190 H572.0 V216 H510.0"/>
    <path class="pulse" style="animation-delay:2.59s" d="M722.0 190 H764.0 V208 H820"/>
    <path class="pulse" style="animation-delay:2.96s" d="M652 114.0 V88.0 H682 V20"/>
    <path class="pulse" style="animation-delay:0.33s" d="M652 206.0 V228.0 H618 V300"/>
    <path class="pulse" style="animation-delay:0.70s" d="M676 114.0 V80.0 H706 V20"/>
    <path class="pulse" style="animation-delay:1.07s" d="M676 206.0 V236.0 H642 V300"/>
    <path class="pulse" style="animation-delay:1.44s" d="M700 114.0 V72.0 H730 V20"/>
    <path class="pulse" style="animation-delay:1.81s" d="M700 206.0 V244.0 H666 V300"/>
