<svg xmlns="http://www.w3.org/2000/svg" width="840" height="72" viewBox="0 0 840 72" role="img" aria-label="Featured projects">
  <title>Featured projects</title>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#050807"/>
      <stop offset="0.7" stop-color="#08130e"/>
      <stop offset="1" stop-color="#0b1f17"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="838" height="70" rx="12"/></clipPath>
  </defs>
  <style>
    .sweep { animation: sweep 5s ease-in-out infinite; }
    .dot { animation: blink 2.4s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-140px); } 60%, 100% { transform: translateX(860px); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) { .sweep, .dot { animation: none; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="840" height="72" fill="url(#bg)"/>
    <rect x="0" y="69" width="840" height="3" fill="url(#line)"/>
    <rect class="sweep" x="0" y="69" width="120" height="3" fill="url(#sweep)" opacity="0.6"/>
  </g>
  <rect x="1" y="1" width="838" height="70" rx="12" fill="none" stroke="#14532d" stroke-width="1"/>
  <rect x="24" y="22" width="4" height="28" rx="2" fill="#4ade80"/>
  <text x="44" y="44" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" font-weight="600" fill="#4ade80" opacity="0.75">03</text>
  <text x="76" y="45.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="700" fill="#ecfdf3" letter-spacing="0.2">Featured projects</text>
  <circle class="dot" cx="645.5" cy="36" r="3.5" fill="#22d3ee"/>
  <text x="816" y="40.5" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="1.2" fill="#4ade80" opacity="0.8">MISSIONS://FEATURED</text>
</svg>
